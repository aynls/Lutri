name: Build release draft

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag (for example v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos
            arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Check release version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const tauri = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          if (pkg.version !== tauri.version || process.env.RELEASE_TAG !== `v${tauri.version}`) {
            throw new Error('The tag must be v<version> and match package.json and tauri.conf.json.');
          }
          NODE

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libdbus-1-dev libxdo-dev libgomp1 libvulkan1 libfuse2 xdg-utils

      - name: Build macOS upscaling libraries
        if: runner.os == 'macOS'
        run: bash scripts/build-macos-ncnn.sh

      - uses: actions/setup-python@v7
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Check macOS signing configuration
        if: runner.os == 'macOS'
        id: macos-signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE$APPLE_CERTIFICATE_PASSWORD$APPLE_ID$APPLE_PASSWORD$APPLE_TEAM_ID" ]]; then
            echo "::warning::Building an ad hoc signed macOS installer without Apple notarization."
          elif [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Configure all macOS signing and notarization secrets together."
            exit 1
          fi

      - uses: Apple-Actions/import-codesign-certs@v7
        if: steps.macos-signing.outputs.enabled == 'true'
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Select Developer ID identity
        if: steps.macos-signing.outputs.enabled == 'true'
        run: |
          identity=$(security find-identity -v -p codesigning | awk -F '"' '$2 ~ /^Developer ID Application:/ && !found { print $2; found = 1 }')
          if [[ -z "$identity" ]]; then
            echo "::error::The imported certificate must be a Developer ID Application certificate."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build Tauri bundles
        if: steps.macos-signing.outputs.enabled != 'true'
        run: npm run app:build -- --target ${{ matrix.target }} --ci

      - name: Build hardened macOS application
        if: steps.macos-signing.outputs.enabled == 'true'
        run: npm run app:build -- --target ${{ matrix.target }} --ci --config '{"bundle":{"macOS":{"hardenedRuntime":true}}}'

      - name: Build branded macOS installer
        if: runner.os == 'macOS'
        env:
          BUNDLE_DIR: src-tauri/target/${{ matrix.target }}/release/bundle
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python -m pip install dmgbuild==1.6.7
          mkdir -p "$BUNDLE_DIR/dmg"
          dmg="$BUNDLE_DIR/dmg/Lutri_${RELEASE_TAG#v}_aarch64.dmg"
          python scripts/build-macos-dmg.py "$BUNDLE_DIR/macos/Lutri.app" "$dmg"
          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            codesign --sign "$APPLE_SIGNING_IDENTITY" --timestamp --identifier app.lutri.studio.dmg "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*_aarch64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  release:
    name: Create release draft
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Create draft and upload assets
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const tag = process.env.RELEASE_TAG;
            const repo = context.repo;
            async function filesIn(directory) {
              const entries = await fs.readdir(directory, { withFileTypes: true });
              const groups = await Promise.all(entries.map(entry => {
                const file = path.join(directory, entry.name);
                return entry.isDirectory() ? filesIn(file) : [file];
              }));
              return groups.flat();
            }
            const suffixes = ['-setup.exe', '.deb', '.AppImage', '_aarch64.dmg'];
            const files = (await filesIn('installers')).filter(file => suffixes.some(suffix => file.endsWith(suffix)));
            for (const suffix of suffixes) {
              if (!files.some(file => file.endsWith(suffix))) {
                throw new Error(`Missing installer: ${suffix}`);
              }
            }
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            let release = releases.find(item => item.tag_name === tag);
            if (release && !release.draft) {
              throw new Error(`${tag} is already published; refusing to replace its assets.`);
            }
            if (!release) {
              // Require an existing tag even when the workflow was manually dispatched.
              await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
              release = (await github.rest.repos.createRelease({
                ...repo,
                tag_name: tag,
                name: `Lutri ${tag}`,
                draft: true,
                prerelease: tag.includes('-'),
                generate_release_notes: true,
              })).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id: release.id, per_page: 100,
            });
            for (const file of files) {
              const name = path.basename(file);
              const existing = assets.find(asset => asset.name === name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: existing.id });
              }
              await github.rest.repos.uploadReleaseAsset({
                ...repo,
                release_id: release.id,
                name,
                data: await fs.readFile(file),
                headers: { 'content-type': 'application/octet-stream' },
              });
            }
            await core.summary.addLink(`Lutri ${tag} release draft`, release.html_url).write();
